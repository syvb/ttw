on: [push, pull_request]

name: Build serv2

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: [ '14' ]
    name: serv2 on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # newer Rust emits wasm features (multivalue, reference types) that Node 14 and webpack's wasm parser reject
      - name: Install Rust 1.81 toolchain
        uses: dtolnay/rust-toolchain@1.81
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cp config.example.json config.json
      - run: cp config-private.example.json config-private.json
      # serv2 serves the built frontend, which isn't needed for the tests
      - run: mkdir -p web/dist
      - name: Install dependencies
        run: yarn
        working-directory: serv2
      - name: Verify source is valid
        run: node --check *.js forms/*.js static/*.js
        working-directory: serv2
      - name: Try running
        run: SERV2_TEST_MODE=1 ./run.sh
        working-directory: serv2
